{% extends "base.html" %}
{% block title %}Connexion — Relevé du bot{% endblock %}
{% block body %}
<main class="centered">
  <div class="notice">
    <div class="kicker">Kraken · accès restreint</div>
    <h1>Relevé du bot</h1>
    <p>Cette page expose la valeur du portefeuille et les positions en cours.</p>
    <form class="login-form" method="post">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autofocus required autocomplete="current-password">
      <button type="submit">Entrer</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</main>
{% endblock %}
